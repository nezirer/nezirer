<svg xmlns="http://www.w3.org/2000/svg" width="760" height="332" viewBox="0 0 760 332" role="img" aria-label="whoami terminal">
<style>
text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2328;white-space:pre}
.p{fill:#1a7f37} .o{fill:#bc4c00} .d{fill:#0969da} .t{fill:#59636e;font-size:12px}
.k{fill:#f6f8fa}
.f{opacity:0;animation:fade .3s forwards}
.cur{fill:#1a7f37;animation:blink 1s steps(1) infinite}
@keyframes type{to{transform:translateX(760px)}}
@keyframes fade{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
#k0{animation:type 0.36s steps(8) 0.60s forwards}
#l1{animation-delay:1.21s}
#k2{animation:type 0.67s steps(15) 1.71s forwards}
#l3{animation-delay:2.63s}
#k4{animation:type 0.67s steps(15) 3.13s forwards}
#l5{animation-delay:4.06s}
#k6{animation:type 0.63s steps(14) 4.56s forwards}
#l7{animation-delay:5.44s}
#k8{animation:type 0.58s steps(13) 5.94s forwards}
#l9{animation-delay:6.77s}
#last{animation-delay:7.27s}
</style>
<rect width="760" height="332" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text class="t" x="380.0" y="24" text-anchor="middle">nezirer@bursa: ~</text>
<text x="24" y="64"><tspan class="p">$</tspan> whoami</text>
<rect class="k" id="k0" x="22" y="48" width="79.2" height="22"/>
<text id="l1" class="o f" x="24" y="88">nezir erdinç: computer engineer who builds real systems</text>
<text x="24" y="112"><tspan class="p">$</tspan> cat focus.txt</text>
<rect class="k" id="k2" x="22" y="96" width="138.0" height="22"/>
<text id="l3" class="o f" x="24" y="136">software × AI × automation × data × manufacturing</text>
<text x="24" y="160"><tspan class="p">$</tspan> ls ./building</text>
<rect class="k" id="k4" x="22" y="144" width="138.0" height="22"/>
<text id="l5" class="d f" x="24" y="184">web-apps/  internal-tools/  production-digitalization/  ai-integrations/</text>
<text x="24" y="208"><tspan class="p">$</tspan> cat next.txt</text>
<rect class="k" id="k6" x="22" y="192" width="129.60000000000002" height="22"/>
<text id="l7" class="o f" x="24" y="232">AI/ML engineering · software architecture · technical leadership</text>
<text x="24" y="256"><tspan class="p">$</tspan> echo $MOTTO</text>
<rect class="k" id="k8" x="22" y="240" width="121.2" height="22"/>
<text id="l9" class="o f" x="24" y="280">code. automate. deploy.</text>
<text id="last" class="f" x="24" y="304"><tspan class="p">$</tspan> <tspan class="cur">▌</tspan></text>
</svg>
