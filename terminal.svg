<svg xmlns="http://www.w3.org/2000/svg" width="760" height="284" viewBox="0 0 760 284" role="img" aria-label="whoami terminal">
<style>
text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3;white-space:pre}
.p{fill:#7ee787} .c{fill:#e6edf3} .o{fill:#ff8a3d} .d{fill:#79c0ff} .t{fill:#8b949e;font-size:12px}
.k{fill:#161b22}
.f{opacity:0;animation:fade .3s forwards}
.cur{fill:#7ee787;animation:blink 1s steps(1) infinite}
